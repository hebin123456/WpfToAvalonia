name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      prerelease:
        description: '标记为预发布 (prerelease)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - id: ver
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            PRE="false"
          else
            TAG="v0.0.0-dev.${GITHUB_RUN_NUMBER}"
            VERSION="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            PRE="true"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.rid }}
    needs: resolve-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            ext: zip
          - rid: win-arm64
            ext: zip
          - rid: linux-x64
            ext: tar.gz
          - rid: linux-arm64
            ext: tar.gz
          - rid: osx-x64
            ext: tar.gz
          - rid: osx-arm64
            ext: tar.gz
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # 依赖均为纯托管（Roslyn/Humanizer），可在 Linux runner 上交叉发布全部 RID
      - name: Publish (self-contained single-file)
        run: |
          dotnet publish src/WpfToAvalonia.Cli/WpfToAvalonia.Cli.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:PublishSingleFile=true -p:PublishTrimmed=false \
            -p:Version=${VERSION} -p:FileVersion=${VERSION} -p:PackageVersion=${VERSION} \
            -o publish/${{ matrix.rid }}

      - name: Package (${{ matrix.ext }})
        run: |
          cd publish/${{ matrix.rid }}
          if [[ "${{ matrix.ext }}" == "zip" ]]; then
            zip -r ../../wpf2ava-${{ matrix.rid }}-${VERSION}.zip .
          else
            tar -czf ../../wpf2ava-${{ matrix.rid }}-${VERSION}.tar.gz .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wpf2ava-${{ matrix.rid }}
          path: wpf2ava-${{ matrix.rid }}-${{ env.VERSION }}.${{ matrix.ext }}
          if-no-files-found: error

  tool-package:
    name: dotnet global tool package
    needs: resolve-version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: |
          dotnet pack src/WpfToAvalonia.Cli/WpfToAvalonia.Cli.csproj -c Release \
            -p:Version=${VERSION} -p:PackageVersion=${VERSION}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-tool
          path: src/WpfToAvalonia.Cli/nupkg/*.nupkg
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [resolve-version, publish, tool-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
      TAG: ${{ needs.resolve-version.outputs.tag }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum * > checksums-sha256.txt && ls -lh

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: wpf2ava ${{ env.VERSION }}
          prerelease: ${{ needs.resolve-version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*
          body: |
            ## wpf2ava ${{ env.VERSION }}

            WPF → Avalonia 迁移工具（.NET 10 / Avalonia 12 / Roslyn AST）。

            ### 下载

            | 平台 | 文件 |
            |---|---|
            | Windows x64 | `wpf2ava-win-x64-*.zip` |
            | Windows ARM64 | `wpf2ava-win-arm64-*.zip` |
            | Linux x64 | `wpf2ava-linux-x64-*.tar.gz` |
            | Linux ARM64 | `wpf2ava-linux-arm64-*.tar.gz` |
            | macOS Intel | `wpf2ava-osx-x64-*.tar.gz` |
            | macOS Apple Silicon | `wpf2ava-osx-arm64-*.tar.gz` |

            自包含单文件发布，解压即用，无需安装 .NET 运行时。

            或安装 dotnet 全局工具（`*.nupkg`，框架依赖，需已装 .NET 10 SDK）：
            ```bash
            dotnet tool install -g wpf2ava --add-source <nupkg目录>
            ```

            ### 用法

            ```bash
            wpf2ava <WPF工程.csproj | 解决方案.sln | 目录> [--tfm net10.0] [--dry-run]
            ```
