name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WpfToAvalonia.slnx

      - name: Build (Release)
        run: dotnet build WpfToAvalonia.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/WpfToAvalonia.Tests/WpfToAvalonia.Tests.csproj -c Release --no-build --logger "trx" --results-directory ./TestResults

      - name: Smoke test (convert sample, dry-run)
        run: |
          dotnet run --project src/WpfToAvalonia.Cli -c Release --no-build -- \
            convert samples/WpfShop --dry-run

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
